<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="z-rong 的个人空间：文件查看器与本地音乐播放器两个入口。" />
  <title>z-rong · 我的空间</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #111a33;
      --card: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.09);
      --border: rgba(255, 255, 255, 0.10);
      --text: #e9eefb;
      --muted: #9aa6c2;
      --accent: #5b8cff;
      --accent-2: #a855f7;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef2fb;
        --bg-2: #ffffff;
        --card: #ffffff;
        --card-hover: #ffffff;
        --border: #e2e8f4;
        --text: #1a2238;
        --muted: #66718c;
        --accent: #2563eb;
        --accent-2: #7c3aed;
        --shadow: 0 16px 44px rgba(37, 60, 120, 0.14);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 15% -10%, rgba(91, 140, 255, 0.28), transparent 60%),
        radial-gradient(1000px 600px at 100% 110%, rgba(168, 85, 247, 0.24), transparent 55%),
        linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .landing {
      width: min(920px, 100%);
    }
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-size: 34px; font-weight: 800; letter-spacing: -1px;
      box-shadow: var(--shadow);
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .hero p { margin: 0; color: var(--muted); font-size: 15px; }

    .entries {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 640px) {
      .entries { grid-template-columns: 1fr; }
    }

    .entry {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 28px;
      min-height: 210px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      box-shadow: var(--shadow);
    }
    .entry::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      opacity: 0.9;
    }
    .entry--docs::before { background: linear-gradient(90deg, #5b8cff, #38bdf8); }
    .entry--music::before { background: linear-gradient(90deg, #f472b6, #a855f7); }
    .entry:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    }
    .entry__icon {
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      border-radius: 14px;
      background: rgba(127, 127, 160, 0.16);
    }
    .entry__title { font-size: 22px; font-weight: 750; }
    .entry__desc { color: var(--muted); font-size: 14px; line-height: 1.55; flex: 1; }
    .entry__cta {
      align-self: flex-start;
      font-size: 14px; font-weight: 700;
      color: var(--accent);
    }
    .entry--music .entry__cta { color: var(--accent-2); }

    .foot {
      margin-top: 36px;
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <main class="landing">
    <header class="hero">
      <div class="logo">z</div>
      <h1>我的空间</h1>
      <p>选择一个入口开始</p>
    </header>

    <section class="entries">
      <a class="entry entry--docs" href="readme-view/">
        <span class="entry__icon">📄</span>
        <span class="entry__title">文件查看</span>
        <span class="entry__desc">本地 README / 文档查看器：左侧文件树、沉浸式阅读、明暗主题、全文搜索。</span>
        <span class="entry__cta">进入文件查看 →</span>
      </a>

      <a class="entry entry--music" href="music-player/">
        <span class="entry__icon">🎵</span>
        <span class="entry__title">音乐播放</span>
        <span class="entry__desc">本地音乐播放器：分类浏览、自动收录新音频到「未分组」、可自建分组。</span>
        <span class="entry__cta">进入音乐播放 →</span>
      </a>
    </section>

    <footer class="foot">© z-rong · 纯静态 · 本地优先 · 数据不上传</footer>
  </main>
</body>
</html>
