<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="z-rong 的个人空间：文件查看与音乐播放，切换互不影响，音乐可后台持续播放。" />
  <title>z-rong · 我的空间</title>
  <style>
    :root { --bar-h: 54px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0b1020;
      color: #e9eefb;
      overflow: hidden;
    }

    /* ---------- 顶部切换栏 ---------- */
    .app-tabs {
      flex: 0 0 var(--bar-h);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 14px;
      background: linear-gradient(180deg, #111a30 0%, #0d1424 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .brand {
      display: flex; align-items: center; gap: 9px;
      margin-right: 14px;
      font-weight: 800; letter-spacing: 0.4px;
      color: #e9eefb; user-select: none; white-space: nowrap;
    }
    .brand__dot {
      width: 26px; height: 26px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #5b8cff, #a855f7);
      color: #fff; font-size: 15px; font-weight: 800;
      box-shadow: 0 6px 16px rgba(91, 140, 255, 0.35);
    }
    .app-tab {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px;
      border: none; border-radius: 10px;
      background: transparent; color: #9aa6c2;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: color .16s ease, background .16s ease;
      white-space: nowrap;
    }
    .app-tab:hover { color: #e9eefb; background: rgba(255, 255, 255, 0.06); }
    .app-tab.active { color: #fff; background: rgba(91, 140, 255, 0.20); }
    .app-tab .ico { font-size: 15px; line-height: 1; }

    .tabs-spacer { flex: 1; }
    .playing-hint {
      display: none; align-items: center; gap: 6px;
      font-size: 12.5px; color: #7fd6a8;
      padding-right: 4px;
    }
    .playing-hint.show { display: inline-flex; }
    .playing-hint__dot {
      width: 7px; height: 7px; border-radius: 50%; background: #35d07f;
      box-shadow: 0 0 0 0 rgba(53, 208, 127, 0.6);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(53, 208, 127, 0.55); }
      70% { box-shadow: 0 0 0 7px rgba(53, 208, 127, 0); }
      100% { box-shadow: 0 0 0 0 rgba(53, 208, 127, 0); }
    }

    /* ---------- 内容面板（两个 iframe 常驻，仅切换可见性，绝不卸载） ---------- */
    .panels {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      background: #0b1020;
    }
    .panel {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0b1020;
      visibility: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .panel.active {
      visibility: visible;
      pointer-events: auto;
      z-index: 1;
    }
  </style>
</head>
<body>
  <nav class="app-tabs" role="tablist" aria-label="功能切换">
    <div class="brand"><span class="brand__dot">z</span><span>我的空间</span></div>

    <button class="app-tab active" data-tab="files" role="tab" aria-selected="true">
      <span class="ico">📄</span><span>文件查看</span>
    </button>
    <button class="app-tab" data-tab="music" role="tab" aria-selected="false">
      <span class="ico">🎵</span><span>音乐播放</span>
    </button>

    <span class="tabs-spacer"></span>
    <span class="playing-hint" id="playingHint" title="音乐正在后台播放，切到文件查看不会中断">
      <span class="playing-hint__dot"></span>音乐播放中…
    </span>
  </nav>

  <div class="panels">
    <!-- 文件查看：独立目录 readme-view/ -->
    <iframe id="panel-files" class="panel active" src="readme-view/index.html" title="文件查看" allow="autoplay"></iframe>
    <!-- 音乐播放：独立目录 music-player/（常驻，切换不卸载，保证后台继续播放） -->
    <iframe id="panel-music" class="panel" src="music-player/index.html" title="音乐播放" allow="autoplay"></iframe>
  </div>

  <script>
    (function () {
      'use strict';
      var KEY = 'zr-shell-tab';
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.app-tab'));
      var panels = {
        files: document.getElementById('panel-files'),
        music: document.getElementById('panel-music')
      };
      var hint = document.getElementById('playingHint');
      var musicFrame = panels.music;

      function activate(name) {
        if (!panels[name]) name = 'files';
        tabs.forEach(function (t) {
          var on = t.getAttribute('data-tab') === name;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        Object.keys(panels).forEach(function (k) {
          if (panels[k]) panels[k].classList.toggle('active', k === name);
        });
        try { localStorage.setItem(KEY, name); } catch (e) {}
      }

      tabs.forEach(function (t) {
        t.addEventListener('click', function () { activate(t.getAttribute('data-tab')); });
      });

      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      activate(saved === 'music' ? 'music' : 'files');

      // 监听播放器 iframe 的播放状态，用于点“文件查看”时显示“音乐播放中”提示。
      // 播放器通过 postMessage 上报 { type:'mp-playing', playing:true/false }。
      var musicPlaying = false;
      function setHint(playing) {
        musicPlaying = playing;
        if (hint) hint.classList.toggle('show', playing);
      }
      window.addEventListener('message', function (ev) {
        // 同源校验：只接受来自本播放器 iframe 的消息
        if (ev.source !== musicFrame || !ev.data || typeof ev.data !== 'object') return;
        if (ev.data.type === 'mp-playing') setHint(!!ev.data.playing);
      });

      // 首次切到音乐标签后（iframe 已就绪）请求一次当前播放状态
      musicFrame.addEventListener('load', function () {
        try { musicFrame.contentWindow.postMessage({ type: 'mp-query-state' }, '*'); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
