<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="纯本地、离线可用的 README 文件查看器，左侧文件树 + 右侧沉浸式阅读。" />
  <title>README 查看器 · 沉浸式文档阅读</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- ============ 顶部工具栏 ============ -->
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" title="显示 / 隐藏侧栏" aria-label="切换侧栏">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <div class="brand">
        <span class="brand-mark">R</span>
        <span class="brand-title">README 查看器</span>
      </div>

      <div class="topbar-spacer"></div>

      <div class="search-box" id="searchBox">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="searchInput" type="text" placeholder="搜索文件或路径…" autocomplete="off" spellcheck="false" />
        <button class="search-clear" id="searchClear" hidden aria-label="清除搜索">×</button>
      </div>

      <label class="toggle-chip" title="同时匹配正文内容">
        <input type="checkbox" id="searchContentToggle" />
        <span class="chip-box"></span>
        <span class="chip-text">搜正文</span>
      </label>

      <label class="btn btn-open" for="folderInput" title="选择本地文件夹">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
        </svg>
        <span>打开文件夹</span>
      </label>
      <input id="folderInput" type="file" webkitdirectory directory multiple hidden />

      <button class="icon-btn" id="reloadBtn" title="重新读取 resource/ 目录" aria-label="重新读取">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
      <button class="icon-btn theme-btn" id="themeBtn" title="切换明暗主题" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8Z" />
        </svg>
      </button>
    </header>

    <!-- ============ 主体：侧栏 + 阅读区 ============ -->
    <div class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span class="sidebar-title">文件</span>
          <span class="pill" id="fileCount">0</span>
        </div>
        <nav class="file-tree" id="fileTree" aria-label="文件列表"></nav>
        <div class="sidebar-foot">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="9" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
          <span>默认读取 resource/ 目录 · 全程本地不上传</span>
        </div>
      </aside>

      <div class="overlay" id="overlay"></div>

      <main class="main" id="main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="reading">
          <article class="markdown-body" id="content" aria-live="polite"></article>
        </div>
      </main>
    </div>
  </div>

  <!-- 拖拽提示覆盖层 -->
  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-card">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
          <path d="M12 11v5M9.5 13.5 12 11l2.5 2.5" />
        </svg>
      </div>
      <p class="drop-title">松开以打开文件夹</p>
      <p class="drop-sub">将自动读取其中的 Markdown / README 文件</p>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="markdown.js"></script>
  <script src="sample-data.js"></script>
  <script src="resource-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
